# OmniCash - Blueprint para Render (deploy automático)
# Conéctalo desde el Dashboard de Render: New -> Blueprint -> repositorio,
# o usa la CLI: render blueprint launch
services:
  - type: web
    name: omnicash
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false # se define manualmente en el Dashboard (tu Neon)
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true # Render genera un secreto aleatorio seguro
      - key: YAPE_MERCHANT_PHONE
        value: "921901846"
      - key: YAPE_MERCHANT_NAME
        value: "OmniCash"
      - key: SESSION_TTL
        value: "30d"
      - key: PORT
        value: "4000"