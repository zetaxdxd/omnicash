<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 920" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Recarga con Yape: tu saldo llega al instante">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4600D"/>
      <stop offset="0.55" stop-color="#D9530C"/>
      <stop offset="1" stop-color="#A63E06"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF4EC"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFB980" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFB980" stop-opacity="0"/>
    </radialGradient>
    <style>
      .eyebrow { font: 700 26px 'Segoe UI', system-ui, sans-serif; fill: #FFD9B8; letter-spacing: 6px; }
      .h1 { font: 800 68px 'Segoe UI', system-ui, sans-serif; fill: #FFFFFF; }
      .h2 { font: 800 108px 'Segoe UI', system-ui, sans-serif; fill: #FFFFFF; }
      .sub { font: 500 27px 'Segoe UI', system-ui, sans-serif; fill: rgba(255,255,255,.92); }
      .chip { font: 700 22px 'Segoe UI', system-ui, sans-serif; fill: #7A2C04; }
      .foot { font: 600 20px 'Segoe UI', system-ui, sans-serif; fill: rgba(255,255,255,.7); letter-spacing: 2px; }
      .money { font: 800 34px 'Segoe UI', system-ui, sans-serif; fill: #F4600D; }
      .phone-label { font: 700 15px 'Segoe UI', system-ui, sans-serif; fill: #9AA5B8; letter-spacing: 4px; }
      .brand { font: 800 26px 'Segoe UI', system-ui, sans-serif; fill: #3F4E69; }
    </style>
  </defs>

  <rect width="800" height="920" fill="url(#bg)"/>
  <circle cx="90" cy="180" r="170" fill="#FFFFFF" opacity="0.07"/>
  <circle cx="720" cy="760" r="230" fill="#FFFFFF" opacity="0.06"/>
  <circle cx="680" cy="120" r="260" fill="url(#glow)"/>

  <!-- Cabecera -->
  <text x="400" y="78" text-anchor="middle" class="eyebrow">PAGOS AL INSTANTE</text>
  <text x="400" y="168" text-anchor="middle" class="h1">RECARGA CON</text>
  <g>
    <rect x="252" y="206" width="296" height="116" rx="26" fill="#FFFFFF"/>
    <text x="400" y="296" text-anchor="middle" class="h2" fill="#F4600D">YAPE</text>
  </g>
  <text x="400" y="368" text-anchor="middle" class="sub">Tu saldo llega al instante, sin filas</text>

  <!-- Teléfono -->
  <g>
    <rect x="285" y="400" width="230" height="412" rx="38" fill="#16202E"/>
    <rect x="299" y="414" width="202" height="384" rx="30" fill="url(#screen)"/>
    <rect x="373" y="428" width="54" height="8" rx="4" fill="#16202E"/>
    <text x="400" y="478" text-anchor="middle" class="money">S/ 100.00</text>
    <rect x="331" y="498" width="134" height="134" rx="18" fill="#FFFFFF"/>
    <g transform="translate(341 508) scale(3.62)">
      <rect width="37" height="37" fill="#FFFFFF"/>
      <path stroke="#1c2733" d="M4 4.5h7m2 0h2m1 0h1m2 0h2m1 0h3m1 0h7M4 5.5h1m5 0h1m2 0h4m9 0h1m5 0h1M4 6.5h1m1 0h3m1 0h1m1 0h1m1 0h2m2 0h1m1 0h1m1 0h3m1 0h1m1 0h3m1 0h1M4 7.5h1m1 0h3m1 0h1m1 0h2m1 0h1m4 0h2m1 0h1m2 0h1m1 0h3m1 0h1M4 8.5h1m1 0h3m1 0h1m1 0h3m1 0h4m2 0h3m1 0h1m1 0h3m1 0h1M4 9.5h1m5 0h1m1 0h3m2 0h4m3 0h1m1 0h1m5 0h1M4 10.5h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7M12 11.5h6m1 0h1m4 0h1M4 12.5h1m1 0h5m2 0h1m4 0h2m1 0h1m4 0h5M13 13.5h4m2 0h2m2 0h6m3 0h1M7 14.5h1m1 0h3m1 0h2m6 0h2m2 0h1m1 0h2M7 15.5h3m3 0h2m1 0h1m1 0h1m1 0h1m1 0h2m2 0h1m2 0h1m1 0h1M4 16.5h1m5 0h5m1 0h1m3 0h3m1 0h1m4 0h2M5 17.5h1m1 0h2m5 0h1m1 0h4m1 0h8m3 0h1M5 18.5h2m3 0h1m1 0h3m2 0h5m3 0h1m3 0h2M5 19.5h1m1 0h1m1 0h1m2 0h2m1 0h1m1 0h1m1 0h1m2 0h3m2 0h1m3 0h1M5 20.5h3m2 0h3m1 0h1m3 0h2m1 0h1m1 0h1m5 0h2M4 21.5h1m7 0h4m3 0h2m1 0h3m1 0h3m1 0h1m1 0h1M4 22.5h1m5 0h3m1 0h3m4 0h2m1 0h2m1 0h2m1 0h1M4 23.5h1m1 0h1m1 0h2m1 0h4m1 0h1m1 0h1m1 0h1m2 0h2m1 0h2m3 0h1M4 24.5h1m1 0h1m1 0h1m1 0h7m3 0h2m1 0h6m1 0h3M12 25.5h1m3 0h4m1 0h2m1 0h1m3 0h5M4 26.5h7m2 0h1m1 0h1m1 0h5m1 0h2m1 0h1m1 0h3M4 27.5h1m5 0h1m1 0h1m2 0h3m1 0h1m3 0h2m3 0h1M4 28.5h1m1 0h3m1 0h1m1 0h1m1 0h2m2 0h2m1 0h1m2 0h5m1 0h1m1 0h1M4 29.5h1m1 0h3m1 0h1m1 0h2m1 0h1m3 0h4m1 0h1m4 0h2M4 30.5h1m1 0h3m1 0h1m1 0h1m1 0h1m8 0h9M4 31.5h1m5 0h1m2 0h2m2 0h1m2 0h1m3 0h4m1 0h1m1 0h1M4 32.5h7m1 0h1m2 0h4m3 0h1m2 0h1m1 0h1m2 0h1"/>
    </g>
    <text x="400" y="676" text-anchor="middle" class="phone-label">PAGA CON TU APP</text>
    <text x="400" y="728" text-anchor="middle" class="brand">OmniCash</text>
  </g>

  <!-- Chips -->
  <g>
    <rect x="212" y="826" width="210" height="52" rx="26" fill="#FFFFFF"/>
    <text x="317" y="860" text-anchor="middle" class="chip">1 SOL = 1 CRÉDITO</text>
    <rect x="412" y="826" width="190" height="52" rx="26" fill="#FFFFFF"/>
    <text x="507" y="860" text-anchor="middle" class="chip">AUTO Y SEGURO</text>
  </g>
  <text x="400" y="910" text-anchor="middle" class="foot">OMNICASH · BANCO DIGITAL</text>
</svg>